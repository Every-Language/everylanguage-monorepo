bucket_definitions:
  # ====================
  # PRIORITY 1 - Global Bible Content (Syncs First)
  # ====================
  # Core bible structure - always available (foundation for all content)
  # No parameters needed - this is global data available to all users

  global_bible_content:
    priority: 1
    data:
      - SELECT * FROM bible_versions
      - SELECT * FROM books
      - SELECT * FROM chapters
      - SELECT * FROM verses

  # ====================
  # PRIORITY 2 - User Project Data (Syncs After Global Content)
  # ====================
  # User-specific project data and all related content
  # IMPORTANT: These sync rules assume public.users.id = auth.users.id
  # Two-way sync buckets only work for authenticated users (NOT anonymous users)
  # Client must pass 'is_authenticated' = 'true' parameter to sync user data

  user_projects:
    priority: 2
    # Get all project_ids for the current user from user_projects_denormalized
    parameters: |
      SELECT project_id
      FROM user_projects_denormalized
      WHERE user_id = request.user_id()
    data:
      # Projects owned by the user
      - SELECT * FROM projects WHERE id = bucket.project_id
      
      # Sequences linked to the project
      - SELECT * FROM sequences WHERE project_id = bucket.project_id
      
      # Segments linked to the project (via denormalized project_id field)
      # Segments belong to sequences, but project_id is denormalized for efficient querying
      - SELECT * FROM segments WHERE project_id = bucket.project_id
      
      # Audio versions linked to the project
      - SELECT * FROM audio_versions WHERE project_id = bucket.project_id
      
      # Media files linked to the project
      # project_id is denormalized from audio_versions for efficient filtering
      - SELECT * FROM media_files WHERE project_id = bucket.project_id
      
      # Media files verses linked to the project
      # project_id is denormalized for efficient filtering
      # Also filtered by denormalized_audio_version_id and media_file_id to catch all related verses
      - SELECT * FROM media_files_verses WHERE project_id = bucket.project_id
