name: App Bible - Production Deployment

on:
  push:
    branches: [main]
    paths: ['apps/app-bible/**']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build and submit (all, ios, android)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      submit_to_stores:
        description: 'Submit to app stores after build'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: EAS Production Build
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate managed workflow
        working-directory: apps/app-bible
        run: |
          if [ -d "android" ] || [ -d "ios" ]; then
            echo "❌ Native folders detected"
            exit 1
          fi
          npx expo-doctor
          echo "✅ Production build validated"

      - name: Create .env file for build
        working-directory: apps/app-bible
        run: |
          cat > .env << EOF
          EXPO_PUBLIC_ENVIRONMENT=production
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL=${{ secrets.EXPO_PUBLIC_POWERSYNC_BIBLE_URL }}
          EOF

      - name: Build production
        working-directory: apps/app-bible
        run: |
          PLATFORM="${{ matrix.platform }}"
          INPUT_PLATFORM="${{ github.event.inputs.platform }}"
          
          if [ "$INPUT_PLATFORM" = "all" ] || [ "$INPUT_PLATFORM" = "$PLATFORM" ] || [ -z "$INPUT_PLATFORM" ]; then
            echo "🚀 Building production app for $PLATFORM..."
            eas build --platform $PLATFORM --profile production --non-interactive --wait
          else
            echo "⏭️ Skipping production build for $PLATFORM"
          fi

  submit:
    name: Submit to App Stores
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: ${{ github.event.inputs.submit_to_stores == 'true' }}
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to stores
        working-directory: apps/app-bible
        run: |
          PLATFORM="${{ matrix.platform }}"
          INPUT_PLATFORM="${{ github.event.inputs.platform }}"
          
          if [ "$INPUT_PLATFORM" = "all" ] || [ "$INPUT_PLATFORM" = "$PLATFORM" ] || [ -z "$INPUT_PLATFORM" ]; then
            echo "📱 Submitting $PLATFORM app to store..."
            eas submit --platform $PLATFORM --profile production --latest --non-interactive --wait
          else
            echo "⏭️ Skipping store submission for $PLATFORM"
          fi

  ota-update:
    name: Deploy OTA Update
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy OTA update
        working-directory: apps/app-bible
        run: |
          echo "🔄 Deploying OTA update to production..."
          eas update --branch production --message "Production deployment from ${{ github.sha }}"
