name: CI

on:
  # Push: Light checks (format, lint, type-check, unit tests only)
  push:
    branches-ignore: [main, develop]
  # PR: Full validation (format, lint, type-check, full test suite with coverage, build)
  pull_request:
    branches: [develop, main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NODE_VERSION: '20' # Standardize on Node 20 for consistency

jobs:
  # Detect which parts of the monorepo changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shared-types: ${{ steps.filter.outputs.shared-types }}
      frontend-project: ${{ steps.filter.outputs.frontend-project }}
      frontend-partnership: ${{ steps.filter.outputs.frontend-partnership }}
      frontend-admin: ${{ steps.filter.outputs.frontend-admin }}
      frontend-app-bible: ${{ steps.filter.outputs.frontend-app-bible }}
      powersync-rules: ${{ steps.filter.outputs.powersync-rules }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      is-push: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for PR comparison
        
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'supabase/**'
            shared-types:
              - 'packages/shared-types/**'
            frontend-project:
              - 'apps/web-project-dashboard/**'
            frontend-partnership:
              - 'apps/web-partnership-dashboard/**'
            frontend-admin:
              - 'apps/web-admin-dashboard/**'
            frontend-app-bible:
              - 'apps/app-bible/**'
            powersync-rules:
              - 'apps/app-bible/powersync/sync-rules.yaml'

  backend:
    runs-on: ubuntu-latest
    name: Backend Tests & Linting
    needs: detect-changes
    # Run if backend or shared-types changed
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared-types == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run backend linting
        run: cd supabase && pnpm run lint

      - name: Check backend formatting
        run: cd supabase && pnpm run format:check

      - name: Backend type check
        run: cd supabase && pnpm run type-check

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Type check Edge Functions
        run: cd supabase && pnpm run type-check:functions

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local development
        run: cd supabase && supabase start

      - name: Wait for Supabase to be ready
        run: |
          timeout=60
          while ! curl -f http://127.0.0.1:54321/rest/v1/ >/dev/null 2>&1; do
            echo "Waiting for Supabase to start..."
            sleep 2
            timeout=$((timeout-2))
            if [ $timeout -le 0 ]; then
              echo "Timeout waiting for Supabase"
              exit 1
            fi
          done
          echo "Supabase is ready!"

      - name: Run backend tests
        run: cd supabase && pnpm run test
        env:
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
        # On push: run tests without coverage (faster)
        # On PR: run full test suite (coverage handled by test script)

      - name: Stop Supabase
        if: always()
        run: cd supabase && supabase stop

  frontend-project:
    runs-on: ubuntu-latest
    name: Project Dashboard - Tests & Linting
    needs: detect-changes
    # Run if backend, shared-types, or this specific frontend changed
    if: |
      needs.detect-changes.outputs.backend == 'true' || 
      needs.detect-changes.outputs.shared-types == 'true' || 
      needs.detect-changes.outputs.frontend-project == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm --filter=web-project-dashboard run format:check

      - name: Run linting
        run: pnpm --filter=web-project-dashboard run lint

      - name: Run type checking
        run: pnpm --filter=web-project-dashboard run type-check

      - name: Run tests
        # On push: unit tests only (no coverage)
        # On PR: full test suite with coverage
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm --filter=web-project-dashboard run test:coverage
          else
            pnpm --filter=web-project-dashboard run test:run
          fi

      - name: Test build
        # Only run build on PRs (full validation)
        if: github.event_name == 'pull_request'
        run: pnpm --filter=web-project-dashboard run build
        env:
          # Use dummy values for build test
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy_key

  frontend-partnership:
    runs-on: ubuntu-latest
    name: Partnership Dashboard - Tests & Linting
    needs: detect-changes
    # Run if backend, shared-types, or this specific frontend changed
    if: |
      needs.detect-changes.outputs.backend == 'true' || 
      needs.detect-changes.outputs.shared-types == 'true' || 
      needs.detect-changes.outputs.frontend-partnership == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm --filter=web-partnership-dashboard run format:check

      - name: Run linting
        run: pnpm --filter=web-partnership-dashboard run lint

      - name: Run type checking
        run: pnpm --filter=web-partnership-dashboard run type-check

      - name: Run tests
        # On push: unit tests only (no coverage)
        # On PR: full test suite with coverage
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm --filter=web-partnership-dashboard run test:coverage
          else
            pnpm --filter=web-partnership-dashboard run test:run
          fi

      - name: Test build
        # Only run build on PRs (full validation)
        if: github.event_name == 'pull_request'
        run: pnpm --filter=web-partnership-dashboard run build
        env:
          # Use dummy values for build test
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy_key

  frontend-admin:
    runs-on: ubuntu-latest
    name: Admin Dashboard - Tests & Linting
    needs: detect-changes
    # Run if backend, shared-types, or this specific frontend changed
    if: |
      needs.detect-changes.outputs.backend == 'true' || 
      needs.detect-changes.outputs.shared-types == 'true' || 
      needs.detect-changes.outputs.frontend-admin == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm --filter=web-admin-dashboard run format:check

      - name: Run linting
        run: pnpm --filter=web-admin-dashboard run lint

      - name: Run type checking
        run: pnpm --filter=web-admin-dashboard run type-check

      - name: Run tests
        # On push: unit tests only (no coverage)
        # On PR: full test suite with coverage
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm --filter=web-admin-dashboard run test:coverage
          else
            pnpm --filter=web-admin-dashboard run test:run
          fi

      - name: Test build
        # Only run build on PRs (full validation)
        if: github.event_name == 'pull_request'
        run: pnpm --filter=web-admin-dashboard run build
        env:
          # Use dummy values for build test
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy_key

  frontend-app-bible:
    runs-on: ubuntu-latest
    name: App Bible - Tests & Linting
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend == 'true' || 
      needs.detect-changes.outputs.shared-types == 'true' || 
      needs.detect-changes.outputs.frontend-app-bible == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check formatting
        run: pnpm --filter=app-bible run format:check

      - name: Run linting
        run: pnpm --filter=app-bible run lint

      - name: Run type checking
        run: pnpm --filter=app-bible run type-check

      - name: Run tests
        # On push: unit tests only (no coverage)
        # On PR: full test suite with coverage
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm --filter=app-bible run test:ci
          else
            pnpm --filter=app-bible run test:run
          fi

      - name: Validate managed workflow
        working-directory: apps/app-bible
        run: |
          if [ -d "android" ] || [ -d "ios" ]; then
            echo "❌ Native folders detected - should not exist in managed workflow"
            exit 1
          fi
          echo "✅ Managed workflow validated"

  powersync-validation:
    runs-on: ubuntu-latest
    name: PowerSync Schema Validation
    needs: detect-changes
    # Only run on PRs and only if sync-rules.yaml changed
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.powersync-rules == 'true'
    # Use production environment for PRs to main, development for PRs to develop
    environment: ${{ github.base_ref == 'main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate sync rules syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('apps/app-bible/powersync/sync-rules.yaml'))"
          echo "✅ Sync rules YAML syntax is valid"

      - name: Verify schema is in sync with sync rules
        working-directory: apps/app-bible
        env:
          AUTH_TOKEN: ${{ secrets.POWERSYNC_API_TOKEN }}
          ORG_ID: ${{ secrets.POWERSYNC_ORG_ID }}
          PROJECT_ID: ${{ secrets.POWERSYNC_PROJECT_ID }}
          INSTANCE_ID: ${{ secrets.POWERSYNC_INSTANCE_ID }}
        run: |
          echo "🔍 Checking if committed schema matches sync rules..."
          pnpm run powersync:verify-schema
          echo "✅ Schema verification completed"

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    # Only run security scan on PRs (full validation)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run npm audit
        run: pnpm audit --audit-level high
